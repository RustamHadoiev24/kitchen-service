{% extends "kitchen/base.html" %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="fw-bold text-dark">Dishes Menu</h1>
        <a href="{% url 'kitchen:dish-create' %}" class="btn btn-primary">➕ Add New Dish</a>
    </div>

    <form method="GET" action="" class="row g-2 mb-4">
        <div class="col-md-9">
            <input type="text" name="name" class="form-control" placeholder="Search dishes by name..." value="{{ request.GET.name }}">
        </div>
        <div class="col-md-3">
            <button type="submit" class="btn btn-secondary w-100">Search</button>
        </div>
    </form>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th scope="col" class="ps-4">Name</th>
                        <th scope="col">Dish Type</th>
                        <th scope="col">Price</th>
                        <th scope="col" class="text-end pe-4">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for dish in dish_list %}
                        <tr>
                            <td class="ps-4">
                                <a href="{% url 'kitchen:dish-detail' pk=dish.id %}" class="text-decoration-none fw-bold text-primary">
                                    {{ dish.name }}
                                </a>
                            </td>
                            <td><span class="badge bg-light text-dark border">{{ dish.dish_type.name }}</span></td>
                            <td class="fw-bold text-success">${{ dish.price }}</td>
                            <td class="text-end pe-4">
                                <a href="{% url 'kitchen:dish-update' pk=dish.id %}" class="btn btn-outline-secondary btn-sm me-1">Edit</a>
                                <a href="{% url 'kitchen:dish-delete' pk=dish.id %}" class="btn btn-outline-danger btn-sm">Delete</a>
                            </td>
                        </tr>
                    {% empty %}
                        <tr>
                            <td colspan="4" class="text-center py-4 text-muted">No dishes found.</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
