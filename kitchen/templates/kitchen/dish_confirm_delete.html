{% extends "kitchen/base.html" %}

{% block content %}
<div class="card shadow-sm border-0 mx-auto border-danger" style="max-width: 600px;">
    <div class="card-body p-4 text-center">
        <h2 class="text-danger fw-bold mb-3">Delete Dish</h2>
        <p class="fs-5">Are you sure you want to delete the dish <strong>{{ dish.name }}</strong>?</p>
        <form method="POST" action="">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger px-4">Yes, delete</button>
            <a href="{% url 'kitchen:dish-list' %}" class="btn btn-light px-4 ms-2">No, cancel</a>
        </form>
    </div>
</div>
{% endblock %}
